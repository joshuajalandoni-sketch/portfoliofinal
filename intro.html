<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joshua Jalandoni — Portfolio</title>
<meta name="description" content="Joshua Jalandoni. Creative developer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Instrument+Serif:ital@0;1&family=Playfair+Display:ital,wght@1,500;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#050505;
    --bg-mid:#242424;
    --bg-soft:#5a5a5a;
    --cream:#f2f0ea;
    --red:#c1392b;
    --yellow:#f0d896;
    --ink:#101010;
    --sans:'JetBrains Mono', ui-monospace, monospace;
    --pixel:'Didot','GFS Didot','Bodoni MT','Playfair Display',serif;
    --serif-i:'Instrument Serif', serif;
    --script:'Playfair Display', serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(120% 90% at 100% 100%, var(--bg-soft) 0%, var(--bg-mid) 45%, var(--bg-deep) 78%);
    color:var(--cream);
    font-family:var(--sans);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--cream);color:var(--ink);}

  .stage{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
  }

  /* ---------- repeating background text ---------- */
  .bgtext{
    position:absolute; inset:-5% -5%;
    z-index:0;
    display:flex; flex-direction:column;
    gap:6px;
    transform:rotate(0deg);
    -webkit-mask-image:radial-gradient(80% 70% at 30% 40%, #000 0%, rgba(0,0,0,0.35) 60%, transparent 100%);
    mask-image:radial-gradient(80% 70% at 30% 40%, #000 0%, rgba(0,0,0,0.35) 60%, transparent 100%);
    pointer-events:none;
    user-select:none;
  }
  .bgtext .row{
    white-space:nowrap;
    font-family:var(--pixel);
    font-size:44px;
    letter-spacing:6px;
    color:var(--cream);
    opacity:0.055;
  }
  .bgtext .row:nth-child(3n){opacity:0.09;}

  /* ---------- nav ---------- */
  header.nav{
    position:absolute; top:0; left:0; right:0; z-index:20;
    padding:30px 48px;
    display:flex; align-items:center;
    opacity:0; transform:translateY(-14px);
    animation:dropIn .7s cubic-bezier(.16,1,.3,1) .3s forwards;
  }
  .brand{
    font-family:var(--script);
    font-style:italic;
    font-size:22px;
    letter-spacing:0.02em;
  }
  .brand sup{font-size:11px; font-style:normal; letter-spacing:0.05em;}

  @keyframes dropIn{to{opacity:1; transform:translateY(0);}}

  /* ---------- hero ---------- */
  main.hero{
    position:relative; z-index:10;
    height:100%;
    max-width:1360px;
    margin:0 auto;
    padding:0 48px;
    display:grid;
    grid-template-columns:1.15fr 0.85fr;
    align-items:center;
    gap:40px;
  }

  .hero-left{padding-top:20px;}

  h1.name{
    margin-top:0;
    line-height:1.02;
  }
  h1.name .line{
    display:block;
    font-family:var(--pixel);
    font-style:italic;
    font-weight:400;
    font-size:clamp(48px, 8vw, 118px);
    letter-spacing:0.005em;
    color:var(--cream);
    opacity:0; transform:translateY(22px);
    animation:fadeUp .8s cubic-bezier(.16,1,.3,1) forwards;
  }
  h1.name .line.l1{animation-delay:.7s;}
  h1.name .line.l2{
    animation-delay:.86s;
    position:relative;
    color:var(--cream);
  }

  @keyframes fadeUp{to{opacity:1; transform:translateY(0);}}

  /* ---------- computer ---------- */
  .hero-right{
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .computer-wrap{
    position:relative;
    width:min(92%, 460px);
    opacity:0; transform:translateY(30px) scale(0.94);
    animation:riseIn 1s cubic-bezier(.16,1,.3,1) .5s forwards;
  }
  @keyframes riseIn{to{opacity:1; transform:translateY(0) scale(1);}}

  .computer{
    all:unset;
    display:block;
    width:100%;
    cursor:pointer;
    filter:drop-shadow(0 40px 60px rgba(0,0,0,0.55));
  }
  .computer:focus-visible{outline:2px solid var(--yellow); outline-offset:6px; border-radius:14px;}

  .photo-frame{
    position:relative;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 0 0 1px rgba(255,255,255,0.08), 0 30px 70px rgba(0,0,0,0.6);
    transition:transform .5s cubic-bezier(.16,1,.3,1), box-shadow .5s ease;
  }
  .computer:hover .photo-frame{
    transform:scale(1.02);
    box-shadow:0 0 0 1px rgba(255,255,255,0.16), 0 34px 80px rgba(0,0,0,0.7);
  }
  .photo-frame img{
    display:block;
    width:100%;
    height:auto;
    filter:grayscale(1) contrast(1.08) brightness(0.98);
  }
  .photo-vignette{
    position:absolute; inset:0;
    background:radial-gradient(120% 100% at 50% 40%, transparent 55%, rgba(0,0,0,0.55) 100%);
    mix-blend-mode:multiply;
    pointer-events:none;
  }
  .enter-overlay{
    position:absolute; left:54%; top:33%; transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  .power-btn{
    width:64px; height:64px;
    border-radius:50%;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center;
    border:1.5px solid rgba(255,255,255,0.65);
    transition:transform .3s ease, background .3s ease, box-shadow .3s ease;
  }
  .computer:hover .power-btn{
    transform:scale(1.1);
    background:rgba(255,255,255,0.22);
    box-shadow:0 0 30px rgba(255,255,255,0.35);
  }
  .power-btn svg{
    width:26px; height:26px;
    display:block;
  }
  .power-btn svg path,
  .power-btn svg line{
    stroke:#f2f0ea;
  }

  /* ---------- zoom-in transition ---------- */
  body.entering .hero-left,
  body.entering header.nav{
    transition:opacity .5s ease;
    opacity:0;
  }
  body.entering .bgtext{
    transition:opacity .6s ease;
    opacity:0;
  }
  body.entering .computer-wrap{
    transition:transform 1.1s cubic-bezier(.7,0,.2,1);
    transform:translateY(0) scale(1);
  }
  body.entering .hero-right{
    transition:transform 1.1s cubic-bezier(.7,0,.2,1);
  }
  body.entering .screen-inner{
    transition:none;
  }
  body.zoom .photo-frame{
    transition:all 1.05s cubic-bezier(.7,0,.2,1);
  }
  body.zoom .hero-right{
    transition:transform 1.05s cubic-bezier(.7,0,.2,1);
    transform:scale(2.2);
  }
  body.zoom .flash{
    opacity:1;
  }
  .flash{
    position:fixed; inset:0; z-index:50;
    background:var(--cream);
    opacity:0;
    transition:opacity .35s ease;
    pointer-events:none;
  }

  @media (max-width: 880px){
    header.nav{padding:22px 24px;}
    main.hero{
      grid-template-columns:1fr;
      padding:110px 24px 40px;
      height:auto;
      min-height:100vh;
      gap:52px;
    }
    .hero-right{order:-1;}
    .computer-wrap{width:78%; max-width:340px;}
    h1.name .line{font-size:clamp(38px, 13vw, 64px);}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
</style>
</head>

<div class="flash" id="flash"></div>

<script>
  // ---------- repeating background text ----------
  (function(){
    const words = "JOSHUA JALANDONI · CREATIVE DEVELOPER · DESIGN & CODE · ";
    const bg = document.getElementById('bgtext');
    const rowCount = 16;
    let html = '';
    for(let i=0;i<rowCount;i++){
      html += `<div class="row">${words.repeat(6)}</div>`;
    }
    bg.innerHTML = html;
  })();

  // ---------- click-to-enter transition ----------
  const DESTINATION = "index.html";
  const enterBtn = document.getElementById('enterBtn');
  let entering = false;

  function navigate(){
    try{
      // navigate the top-level window (escapes any iframe/sandbox context)
      (window.top || window).location.href = DESTINATION;
    }catch(err){
      window.location.href = DESTINATION;
    }
  }

  function goEnter(e){
    if(e) e.preventDefault();
    if(entering){ return; }
    entering = true;
    document.body.classList.add('entering');
    requestAnimationFrame(()=>{
      setTimeout(()=>{
        document.body.classList.add('zoom');
        setTimeout(navigate, 950);
      }, 60);
    });
  }

  enterBtn.addEventListener('click', goEnter);
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' && document.activeElement === enterBtn) goEnter(e);
  });
</script>
