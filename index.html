<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joshua Jalandoni — Portfolio</title>
<meta name="description" content="Joshua Jalandoni. Creative developer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Instrument+Serif:ital@0;1&family=Playfair+Display:ital,wght@1,500;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#050505;
    --bg-mid:#242424;
    --bg-soft:#5a5a5a;
    --cream:#f2f0ea;
    --red:#c1392b;
    --yellow:#f0d896;
    --ink:#101010;
    --sans:'JetBrains Mono', ui-monospace, monospace;
    --pixel:'Didot','GFS Didot','Bodoni MT','Playfair Display',serif;
    --serif-i:'Instrument Serif', serif;
    --script:'Playfair Display', serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(120% 90% at 100% 100%, var(--bg-soft) 0%, var(--bg-mid) 45%, var(--bg-deep) 78%);
    color:var(--cream);
    font-family:var(--sans);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--cream);color:var(--ink);}

  .stage{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
  }

  /* ---------- nav ---------- */
  header.nav{
    position:absolute; top:0; left:0; right:0; z-index:20;
    padding:30px 48px;
    display:flex; align-items:center;
    opacity:0; transform:translateY(-14px);
    animation:dropIn .7s cubic-bezier(.16,1,.3,1) .3s forwards;
  }
  .brand{
    font-family:var(--script);
    font-style:italic;
    font-size:22px;
    letter-spacing:0.02em;
  }
  .brand sup{font-size:11px; font-style:normal; letter-spacing:0.05em;}

  @keyframes dropIn{to{opacity:1; transform:translateY(0);}}

  /* ---------- hero ---------- */
  main.hero{
    position:relative; z-index:10;
    height:100%;
    max-width:1360px;
    margin:0 auto;
    padding:0 48px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .hero-left{
    padding-top:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  /* ---------- arrows ---------- */
  .arrows{
    width:min(55%, 220px);
    margin-bottom:2px;
    opacity:0; transform:translateY(-14px);
    animation:fadeUp .8s cubic-bezier(.16,1,.3,1) .35s forwards;
  }
  .arrows svg{
    display:block;
    width:100%;
    height:auto;
    overflow:visible;
  }
  .arrows path{
    fill:none;
    stroke:var(--red);
    stroke-width:5;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  /* ---------- eye ---------- */
  .eye-wrap{
    width:min(85%, 520px);
    margin-bottom:20px;
    opacity:0; transform:translateY(18px) scale(0.96);
    animation:fadeUp .9s cubic-bezier(.16,1,.3,1) .55s forwards;
    cursor:pointer;
  }
  .eye-wrap img{
    display:block;
    width:100%;
    height:auto;
    filter:drop-shadow(0 20px 40px rgba(0,0,0,0.6));
  }

  h1.name{
    margin-top:0;
    line-height:1.02;
  }
  h1.name .line{
    display:block;
    font-family:var(--pixel);
    font-style:italic;
    font-weight:400;
    font-size:clamp(48px, 8vw, 118px);
    letter-spacing:0.005em;
    color:var(--cream);
    opacity:0; transform:translateY(22px);
    animation:fadeUp .8s cubic-bezier(.16,1,.3,1) forwards;
  }
  h1.name .line.l1{animation-delay:.7s;}
  h1.name .line.l2{
    animation-delay:.86s;
    position:relative;
    color:var(--cream);
  }

  @keyframes fadeUp{to{opacity:1; transform:translateY(0);}}

  @media (max-width: 880px){
    header.nav{padding:22px 24px;}
    main.hero{
      padding:110px 24px 40px;
      height:auto;
      min-height:100vh;
    }
    .arrows{width:min(70%, 200px);}
    .eye-wrap{width:min(78%, 260px); margin-bottom:20px;}
    h1.name .line{font-size:clamp(38px, 13vw, 64px);}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
</style>
</head>
